[project]
name = "solar-sky-radar"
version = "0.1.2"
description = "Home Assistant HACS Solar Sky & Weather Radar integration and Lovelace card"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9.0",
  "numpy>=1.26.0",
  "pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
